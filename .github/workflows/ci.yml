name: CI - Security Dashboard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Verify Server Startup & Health Check
        run: |
          cd dashboard
          node -e "
            const { startJuiceTarget } = require('./juice-target');
            console.log('Juice target loaded successfully');
            const express = require('express');
            const helmet = require('helmet');
            console.log('All core security libraries validated successfully');
          "
